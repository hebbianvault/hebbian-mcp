name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify-publish-source:
    name: Verify publish source
    uses: ./.github/workflows/publish-divergence-guard.yml
    with:
      tag: ${{ github.ref_name }}

  publish-npm:
    name: Publish @hebbianvault/mcp to npm
    needs: verify-publish-source
    # MUST be a GitHub-hosted runner: npm sigstore provenance + OIDC trusted
    # publishing reject self-hosted (Blacksmith) runners with E422 (measured
    # 2026-07-16, still current per npm docs 2026-07-31). Enforced by
    # .github/runner-allowlist.txt — amend that file only with a gate ruling.
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no NPM_TOKEN secret. One-time setup on
    # npmjs.com → package @hebbianvault/mcp → Settings → Trusted Publisher →
    # GitHub Actions → repo hebbianvault/hebbian-mcp, workflow release.yml.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ts/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 is required for OIDC trusted publishing; Node 24 ships it.
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        # OIDC trusted publishing — provenance attestation is automatic.
        run: npm publish --access public

  publish-pypi:
    name: Publish hebbianvault-mcp to PyPI
    needs: verify-publish-source
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Trusted publishing (OIDC): no PYPI_API_TOKEN secret. One-time setup on
    # pypi.org → project hebbianvault-mcp → Publishing → add GitHub publisher:
    # owner hebbianvault, repo hebbian-mcp, workflow release.yml.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: py/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Test before publish
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        # OIDC trusted publishing — no password input. skip-existing lets a
        # re-tagged release re-run cleanly when one registry already has the
        # version (e.g. v0.2.1: PyPI published, npm failed on provenance).
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist/
          skip-existing: true

  verify-registry-parity:
    name: Verify npm and PyPI registry parity
    needs: [publish-npm, publish-pypi]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Confirm published versions
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          npm_version=""
          for attempt in {1..5}; do
            if npm_version="$(npm view "@hebbianvault/mcp@${VERSION}" version 2>/dev/null)"; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "npm version lookup failed (attempt ${attempt}/5); retrying in 20 seconds" >&2
              sleep 20
            fi
          done

          if [ -z "$npm_version" ]; then
            echo "Unable to look up @hebbianvault/mcp@${VERSION} on npm after 5 attempts" >&2
            exit 1
          fi
          if [ "$npm_version" != "$VERSION" ]; then
            echo "npm published version ${npm_version} does not match tag version ${VERSION}" >&2
            exit 1
          fi

          pypi_version=""
          for attempt in {1..5}; do
            if pypi_version="$(curl -fsSL "https://pypi.org/pypi/hebbianvault-mcp/${VERSION}/json" | jq -er '.info.version')"; then
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              echo "PyPI version lookup failed (attempt ${attempt}/5); retrying in 20 seconds" >&2
              sleep 20
            fi
          done

          if [ -z "$pypi_version" ]; then
            echo "Unable to look up hebbianvault-mcp ${VERSION} on PyPI after 5 attempts" >&2
            exit 1
          fi
          if [ "$pypi_version" != "$VERSION" ]; then
            echo "PyPI published version ${pypi_version} does not match tag version ${VERSION}" >&2
            exit 1
          fi

  bump-homebrew-formula:
    needs: publish-npm
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Extract npm package version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Bump tap formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: hebbian-mcp
          formula-path: Formula/hebbian-mcp.rb
          homebrew-tap: hebbianvault/homebrew-tap
          base-branch: main
          download-url: https://registry.npmjs.org/@hebbianvault/mcp/-/mcp-${{ steps.ver.outputs.version }}.tgz
          commit-message: |
            hebbian-mcp ${{ github.ref_name }}

            Auto-bump from upstream release.
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
