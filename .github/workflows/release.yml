name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-npm:
    name: Publish @hebbianvault/mcp to npm
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no NPM_TOKEN secret. One-time setup on
    # npmjs.com → package @hebbianvault/mcp → Settings → Trusted Publisher →
    # GitHub Actions → repo hebbianvault/hebbian-mcp, workflow release.yml.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ts/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # npm >= 11.5.1 is required for OIDC trusted publishing; Node 24 ships it.
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        # OIDC trusted publishing — provenance attestation is automatic.
        run: npm publish --access public

  publish-pypi:
    name: Publish hebbianvault-mcp to PyPI
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no PYPI_API_TOKEN secret. One-time setup on
    # pypi.org → project hebbianvault-mcp → Publishing → add GitHub publisher:
    # owner hebbianvault, repo hebbian-mcp, workflow release.yml.
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: py/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --dev

      - name: Test before publish
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        # OIDC trusted publishing — no password input. skip-existing lets a
        # re-tagged release re-run cleanly when one registry already has the
        # version (e.g. v0.2.1: PyPI published, npm failed on provenance).
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist/
          skip-existing: true

  bump-homebrew-formula:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - name: Bump tap formula
        uses: mislav/bump-homebrew-formula-action@v3
        with:
          formula-name: hebbian-mcp
          formula-path: Formula/hebbian-mcp.rb
          homebrew-tap: hebbianvault/homebrew-tap
          base-branch: main
          download-url: https://registry.npmjs.org/@hebbianvault/mcp/-/mcp-${{ github.ref_name }}.tgz
          commit-message: |
            hebbian-mcp ${{ github.ref_name }}

            Auto-bump from upstream release.
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
