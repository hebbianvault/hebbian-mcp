name: Auto tag release

on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]

# The tag is created only after CI succeeds on main. A workflow_run event runs
# from the default branch, so explicitly check out the tested SHA below.
permissions:
  actions: write
  contents: write

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

jobs:
  tag-and-dispatch:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reject divergent package metadata
        id: version
        run: python3 .github/scripts/publish_divergence_guard.py

      - name: Create the immutable version tag
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git fetch --force --tags origin

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            if git merge-base --is-ancestor "${tag}^{commit}" "$TARGET_SHA"; then
              echo "${tag} already names an ancestor of ${TARGET_SHA}; no release is due."
              echo "created=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::${tag} already exists outside this commit's history. Refusing to reuse a divergent tag." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" "$TARGET_SHA" --message "Release ${tag}"
          git push origin "refs/tags/${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch the release workflow for the new tag
        if: ${{ steps.tag.outputs.created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh workflow run release.yml --ref "$TAG"
