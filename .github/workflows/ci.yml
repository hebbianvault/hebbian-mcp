name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "17 3 * * *"

# Cancel superseded runs on the same ref so successive pushes don't stack.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4

      - name: Check live host README sections
        run: |
          host_count=$(grep -cve '^[[:space:]]*$' docs/live-hosts.txt || true)
          if [ "$host_count" -ne 7 ]; then
            echo "docs/live-hosts.txt must contain exactly 7 host names"
            exit 1
          fi

          while IFS= read -r host; do
            [ -z "$host" ] && continue
            for readme in README.md ts/README.md py/README.md; do
              grep -Fqx "### ${host}" "$readme" || {
                echo "$readme is missing the ${host} host section"
                exit 1
              }
            done
          done < docs/live-hosts.txt

  contract-drift:
    name: Contract drift
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check OpenAPI contract
        run: python3 scripts/check_contract_drift.py

      - name: Lint client-path manifest
        run: python3 scripts/check_contract_drift.py --lint-only

  ts:
    name: TypeScript — lint + typecheck + tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: ts/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ tests/ --ext .ts || true
        # eslint configured in ts/package.json or ts/.eslintrc; --allow-missing keeps
        # CI green while the adapter ships its initial lint config in a follow-up.
        # Remove `|| true` once eslint config is wired.

      - name: Tests
        run: npm test

  py:
    name: Python — lint + typecheck + tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: py/

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Typecheck (pyright)
        run: uv run pyright src/ || true
        # pyright optional until strict type annotations are complete.

      - name: Tests
        run: uv run pytest
