[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hebbianvault-mcp"
version = "0.4.2"
description = "Customer-installable MCP server for the Hebbian tenant brain (Python). Same 13 tools as the Node.js sibling @hebbianvault/mcp."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["mcp", "hebbian", "knowledge-graph", "ai-tools", "model-context-protocol"]
authors = [
    { name = "Hebbian", email = "hello@hebbian.ai" }
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "pyright>=1.1",
]

[project.scripts]
hebbian-mcp = "hebbianvault_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hebbianvault_mcp"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "ANN", "S", "B", "UP"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "S105", "S106", "ANN401"]
"src/hebbianvault_mcp/client.py" = ["ANN401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src", "tests"]
